<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별을 향해</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1026;
      color: #fff;
      font-family: "Malgun Gothic", sans-serif;
    }
    h1 { margin: 0 0 8px; }
    #info {
      display: flex;
      gap: 22px;
      margin-bottom: 8px;
      font-size: 17px;
    }
    #stage { font-weight: bold; color: #ffd166; }
    #score.down { color: #ff6b6b; }
    #wrap { position: relative; }
    canvas {
      display: block;
      border: 4px solid #2b3467;
      border-radius: 10px;
      max-width: 95vw;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 10px;
    }
    #message { font-size: 56px; font-weight: bold; }
    #sub { font-size: 20px; line-height: 1.6; padding: 0 20px; }
    #startBtn {
      font-size: 24px;
      padding: 12px 32px;
      border: none;
      border-radius: 10px;
      background: #ffd166;
      color: #1b1b2f;
      font-weight: bold;
      cursor: pointer;
    }
    #startBtn:hover { background: #ffe29a; }
    #help { margin-top: 8px; font-size: 14px; color: #aab; }
    .hidden { display: none !important; }

    /* ===== 시작 화면 그림 ===== */
    #titleScreen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }
    #startCat { cursor: pointer; }
    #startCat .catBody { animation: bob 0.3s ease-in-out infinite alternate; }
    #startCat:hover .catBody { filter: brightness(1.12); }
    #startCat .leg { transform-box: fill-box; transform-origin: top center; }
    #startCat .legA { animation: run 0.3s ease-in-out infinite alternate; }
    #startCat .legB { animation: run 0.3s ease-in-out infinite alternate-reverse; }
    #startCat .tail { transform-box: fill-box; transform-origin: right bottom; animation: wag 0.6s ease-in-out infinite alternate; }
    #titleStar { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
    #titleSparkles circle { animation: blink 0.8s ease-in-out infinite alternate; }
    #titleSparkles circle:nth-child(2) { animation-delay: 0.3s; }
    #titleSparkles circle:nth-child(3) { animation-delay: 0.6s; }
    #titleHint { animation: blink 1s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    @keyframes run { from { transform: rotate(30deg); } to { transform: rotate(-30deg); } }
    @keyframes wag { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    @keyframes blink { from { opacity: 1; } to { opacity: 0.35; } }
  </style>
</head>
<body>
  <a href="../index.html" style="position:fixed;top:12px;left:16px;color:#aab;font-size:14px;text-decoration:none;z-index:10">← 게임 목록</a>
  <h1>⭐ 별을 향해</h1>
  <div id="info">
    <div id="stage"></div>
    <div>통과: <span id="score">0</span> / <span id="total">0</span></div>
    <div>최고: <span id="best">0</span></div>
  </div>

  <div id="wrap">
    <canvas id="game" width="800" height="480"></canvas>
    <div id="overlay">
      <!-- 시작 화면: 산 → 도시 → 우주선 → 별 을 향해 달려가는 고양이 -->
      <svg id="titleScreen" viewBox="0 0 800 480">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8fd3ff" />
            <stop offset="0.45" stop-color="#ffcf9e" />
            <stop offset="0.75" stop-color="#3b3f8f" />
            <stop offset="1" stop-color="#0b0b24" />
          </linearGradient>
          <radialGradient id="glow">
            <stop offset="0" stop-color="#ffe680" stop-opacity="0.9" />
            <stop offset="1" stop-color="#ffe680" stop-opacity="0" />
          </radialGradient>
        </defs>

        <rect width="800" height="480" fill="url(#sky)" />
        <!-- 오른쪽 하늘의 작은 별 -->
        <g fill="#fff" opacity="0.85">
          <circle cx="620" cy="60" r="1.5" /><circle cx="700" cy="150" r="1.2" /><circle cx="760" cy="90" r="1.8" />
          <circle cx="660" cy="230" r="1" /><circle cx="590" cy="170" r="1.2" /><circle cx="780" cy="250" r="1" />
        </g>
        <!-- 산 -->
        <polygon points="-20,420 90,250 200,420" fill="#6c9c7f" />
        <polygon points="70,420 170,290 280,420" fill="#5a8a6c" />
        <polygon points="75,282 90,250 106,282 97,276 90,285 82,276" fill="#fff" />
        <!-- 도시 -->
        <g fill="#8a7aa8">
          <rect x="300" y="330" width="40" height="90" /><rect x="345" y="290" width="35" height="130" />
          <rect x="385" y="345" width="45" height="75" /><rect x="435" y="310" width="30" height="110" />
        </g>
        <!-- 높은 건물 -->
        <rect x="560" y="240" width="70" height="180" fill="#2e3270" />
        <g fill="#ffe08a" opacity="0.8">
          <rect x="572" y="256" width="10" height="12" /><rect x="606" y="256" width="10" height="12" />
          <rect x="572" y="290" width="10" height="12" /><rect x="589" y="324" width="10" height="12" />
          <rect x="606" y="358" width="10" height="12" />
        </g>
        <!-- 별이 남긴 반짝이 (별을 쫓아가는 길) -->
        <g id="titleSparkles" fill="#ffe680">
          <circle cx="630" cy="200" r="3" /><circle cx="668" cy="158" r="4" /><circle cx="700" cy="122" r="5" />
        </g>
        <!-- 별 -->
        <circle cx="740" cy="70" r="60" fill="url(#glow)" />
        <polygon id="titleStar" fill="#ffd166" stroke="#ff9f1c" stroke-width="3"
                 points="740,38 748,60 772,60 753,74 760,98 740,84 720,98 727,74 708,60 732,60" />
        <!-- 땅 -->
        <rect x="0" y="420" width="800" height="60" fill="#4a7c59" />
        <rect x="0" y="434" width="800" height="46" fill="#3a5a45" />
        <!-- 가는 길 표시 -->
        <path d="M360 400 Q 520 330 610 220 T 720 110" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round" opacity="0.7" />

        <!-- 제목 -->
        <text x="400" y="90" text-anchor="middle" font-size="64" font-weight="bold" fill="#ffd166"
              font-family="Malgun Gothic, sans-serif" stroke="#3a2a5a" stroke-width="2.5">별을 향해</text>
        <text id="titleHint" x="400" y="130" text-anchor="middle" font-size="20" fill="#fff"
              font-family="Malgun Gothic, sans-serif" stroke="#3a2a5a" stroke-width="0.6">고양이를 눌러서 출발!</text>

        <!-- 달리는 고양이 (누르면 시작) -->
        <g id="startCat" transform="translate(220 362) scale(1.15)">
          <ellipse cx="15" cy="54" rx="95" ry="8" fill="#00000033" />
          <clipPath id="bodyClip"><ellipse cx="0" cy="0" rx="60" ry="32" /></clipPath>
          <clipPath id="headClip"><ellipse cx="64" cy="-30" rx="38" ry="33" /></clipPath>
          <g class="catBody" stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
            <!-- 꼬리 (끝만 하얀색) -->
            <g class="tail">
              <path d="M-50 -8 Q -104 -20 -90 -80" fill="none" stroke-width="18" />
              <path d="M-50 -8 Q -104 -20 -90 -80" fill="none" stroke="#23232b" stroke-width="12" />
              <circle cx="-90" cy="-84" r="8" fill="#fafafa" stroke-width="3" />
            </g>
            <!-- 다리 4개 (발은 하얀 양말) -->
            <g class="leg legB"><rect x="-35" y="10" width="14" height="38" rx="7" fill="#15151b" /><ellipse cx="-28" cy="50" rx="9" ry="7" fill="#fafafa" /></g>
            <g class="leg legA"><rect x="33" y="10" width="14" height="38" rx="7" fill="#15151b" /><ellipse cx="40" cy="50" rx="9" ry="7" fill="#fafafa" /></g>
            <g class="leg legA"><rect x="-51" y="10" width="14" height="38" rx="7" fill="#23232b" /><ellipse cx="-44" cy="50" rx="9" ry="7" fill="#fafafa" /></g>
            <g class="leg legB"><rect x="17" y="10" width="14" height="38" rx="7" fill="#23232b" /><ellipse cx="24" cy="50" rx="9" ry="7" fill="#fafafa" /></g>
            <!-- 몸통 (검정) + 하얀 배와 가슴 -->
            <ellipse cx="0" cy="0" rx="60" ry="32" fill="#23232b" />
            <g clip-path="url(#bodyClip)" stroke="none" fill="#fafafa">
              <ellipse cx="14" cy="22" rx="40" ry="16" />
              <ellipse cx="46" cy="4" rx="18" ry="22" />
            </g>
            <ellipse cx="0" cy="0" rx="60" ry="32" fill="none" />
            <text x="-8" y="4" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffd166"
                  font-family="Arial Black, sans-serif" stroke="#111" stroke-width="1.5">START</text>
            <!-- 뾰족한 귀 -->
            <polygon points="36,-52 40,-94 64,-62" fill="#23232b" />
            <polygon points="70,-64 94,-92 96,-46" fill="#23232b" />
            <polygon points="43,-60 45,-82 58,-64" fill="#ffb3c1" stroke="none" />
            <polygon points="76,-64 90,-82 91,-54" fill="#ffb3c1" stroke="none" />
            <!-- 얼굴 (검정) + 하얀 코줄무늬와 주둥이 -->
            <ellipse cx="64" cy="-30" rx="38" ry="33" fill="#23232b" />
            <g clip-path="url(#headClip)" stroke="none" fill="#fafafa">
              <polygon points="62,-56 68,-56 78,-18 56,-18" />
              <ellipse cx="67" cy="-12" rx="22" ry="13" />
            </g>
            <ellipse cx="64" cy="-30" rx="38" ry="33" fill="none" />
            <!-- 눈 (연두색, 세로 눈동자) -->
            <ellipse cx="52" cy="-34" rx="7.5" ry="8.5" fill="#d4e85a" stroke-width="2" />
            <ellipse cx="53" cy="-34" rx="2.4" ry="6.5" fill="#111" stroke="none" />
            <circle cx="50" cy="-38" r="2" fill="#fff" stroke="none" />
            <ellipse cx="80" cy="-34" rx="7.5" ry="8.5" fill="#d4e85a" stroke-width="2" />
            <ellipse cx="81" cy="-34" rx="2.4" ry="6.5" fill="#111" stroke="none" />
            <circle cx="78" cy="-38" r="2" fill="#fff" stroke="none" />
            <!-- 볼, 코, 입 -->
            <ellipse cx="52" cy="-12" rx="5" ry="3" fill="#ff8fa8" opacity="0.5" stroke="none" />
            <ellipse cx="84" cy="-12" rx="5" ry="3" fill="#ff8fa8" opacity="0.5" stroke="none" />
            <polygon points="63,-22 73,-22 68,-16" fill="#ff8fa8" stroke="none" />
            <path d="M68 -16 L68 -12 M62 -11 Q65 -7 68 -12 Q71 -7 74 -11" fill="none" stroke="#555" stroke-width="2.5" />
            <!-- 수염 -->
            <path d="M88 -16 L114 -22 M88 -12 L116 -12 M88 -8 L112 -2 M48 -16 L24 -22 M48 -10 L22 -8"
                  stroke="#cfcfd8" stroke-width="2" />
          </g>
        </g>
      </svg>

      <div id="message" class="hidden"></div>
      <div id="sub" class="hidden"></div>
      <button id="startBtn" class="hidden">다시 시작</button>
    </div>
  </div>

  <div id="help">스페이스 · ↑ · 클릭 = 폴짝 날기 · 파이프에 부딪히거나 바닥에 떨어지면 게임 오버 · M = 음악 켜기/끄기</div>

  <script>
    // ===== 기본 준비 =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const overlay = document.getElementById("overlay");
    const titleScreen = document.getElementById("titleScreen");
    const startCat = document.getElementById("startCat");
    const message = document.getElementById("message");
    const sub = document.getElementById("sub");
    const startBtn = document.getElementById("startBtn");
    const stageText = document.getElementById("stage");
    const scoreText = document.getElementById("score");
    const totalText = document.getElementById("total");
    const bestText = document.getElementById("best");

    // ===== 설정 값 =====
    const PIPES_PER_STAGE = 8; // 스테이지마다 파이프 개수
    const PIPE_W = 70;         // 파이프 굵기
    const PIPE_GAP_X = 280;    // 파이프 사이 거리
    const GROUND = 40;         // 바닥 높이
    const CAT_X = W * 0.3;     // 화면에서 고양이가 있는 자리
    // 스테이지마다: 빠르기, 위아래 구멍 크기, 파이프가 위아래로 움직이는 정도
    const STAGES = [
      { name: "⛰️ 산속",     speed: 3.0, gap: 175, move: 0 },
      { name: "🏙️ 도시",     speed: 3.3, gap: 165, move: 0 },
      { name: "🏢 건물 옥상", speed: 3.6, gap: 155, move: 25 },
      { name: "🛸 우주선",   speed: 3.8, gap: 158, move: 30 },
      { name: "🌌 우주",     speed: 3.4, gap: 170, move: 45 },
    ];
    // 땅에서의 점프 / 우주에서의 점프 (우주는 둥실둥실)
    const PHYSICS = {
      ground: { gravity: 0.42, flap: 7.2 },
      space:  { gravity: 0.2,  flap: 4.8 },
    };

    // ===== 게임에 나오는 것들 =====
    const player = { x: 0, y: 0, vy: 0, angle: 0, dead: false }; // y = 고양이 가운데
    let pipes = [];
    let stageStarts = []; // 각 스테이지가 시작하는 위치
    let worldEnd = 0;
    let star = { x: 0, y: 0 };

    // ===== 게임 상태 =====
    let playing = false;
    let camX = 0;
    let flapQueued = false;
    let flapAnim = 0;
    let score = 0;
    let best = 0;
    let stageIndex = 0;
    let bannerTimer = 0;
    let endTime = 0;
    let time = 0;

    // ===== 작은 도움 함수 =====
    function rand(a, b) { return a + Math.random() * (b - a); }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    // 같은 숫자를 넣으면 항상 같은 '무작위' 값 (배경 장식용)
    function prand(n) { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); }

    function stageAt(x) {
      let s = 0;
      for (let i = 0; i < stageStarts.length; i++) if (x >= stageStarts[i]) s = i;
      return s;
    }

    // ===== 맵 만들기: 위아래 파이프 늘어놓기 =====
    function makeWorld() {
      pipes = [];
      stageStarts = [];
      let x = 0;
      for (let s = 0; s < STAGES.length; s++) {
        const st = STAGES[s];
        stageStarts.push(x);
        x += s === 0 ? 650 : 380; // 스테이지 처음은 여유 있게
        const bottom = s === 4 ? H : H - GROUND; // 우주에는 바닥이 없음
        const minY = st.gap / 2 + st.move + 30;
        const maxY = bottom - st.gap / 2 - st.move - 30;
        let gapY = bottom / 2;
        for (let i = 0; i < PIPES_PER_STAGE; i++) {
          // 구멍 높이는 앞 파이프에서 너무 멀지 않게
          gapY = clamp(gapY + rand(-110, 110), minY, maxY);
          pipes.push({ x, gapY, gap: st.gap, move: st.move, phase: rand(0, Math.PI * 2), stage: s, bottom, passed: false });
          x += PIPE_GAP_X;
        }
      }
      star = { x: x + 300, y: H / 2 };
      worldEnd = star.x + 400;
      totalText.textContent = pipes.length;
    }

    // 파이프 구멍의 지금 높이 (움직이는 파이프는 위아래로 출렁)
    function gapCenter(p) {
      return p.gapY + Math.sin(time * 0.03 + p.phase) * p.move;
    }

    function resetGame() {
      makeWorld();
      Object.assign(player, { x: CAT_X, y: H / 2 - 40, vy: 0, angle: 0, dead: false });
      camX = 0;
      flapQueued = false;
      flapAnim = 0;
      score = 0;
      stageIndex = 0;
      bannerTimer = 120;
      showInfo();
    }

    // ===== 배경 음악 =====
    // 브라우저는 사람이 한 번 누르기 전에는 소리를 못 내게 해서, 게임을 시작할 때 틀어요
    const bgm = new Audio("music/bgm.mp3");
    bgm.loop = true;   // 끝나면 처음부터 다시
    bgm.volume = 0.4;  // 소리 크기 (0 ~ 1)
    let musicOn = true;
    function playMusic() {
      if (musicOn && bgm.paused) bgm.play().catch(() => {}); // 파일이 없어도 게임은 그대로
    }
    function toggleMusic() {
      musicOn = !musicOn;
      if (musicOn) playMusic();
      else bgm.pause();
    }

    // ===== 조작 =====
    function flap() {
      if (playing) flapQueued = true;
    }
    document.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
      if (e.repeat) return;
      if (e.key === "m" || e.key === "M" || e.key === "ㅡ") return toggleMusic(); // M: 음악 켜기/끄기
      // 시작/끝 화면에서는 스페이스나 엔터로 시작 (끝나고 0.6초는 기다리기)
      if (!playing) {
        if ((e.key === " " || e.key === "Enter") && performance.now() - endTime > 600) startGame();
        return;
      }
      if (e.key === " " || e.key === "ArrowUp") flap();
    });
    canvas.addEventListener("pointerdown", flap);

    // ===== 한 번 움직이기 (1초에 60번) =====
    function update() {
      time++;
      const s = stageAt(player.x);
      const P = s === 4 ? PHYSICS.space : PHYSICS.ground;

      // 폴짝! (누를 때마다 위로 튀어 오름)
      if (flapQueued) {
        player.vy = -P.flap;
        flapQueued = false;
        flapAnim = 12;
      }
      if (flapAnim > 0) flapAnim--;
      player.vy = Math.min(player.vy + P.gravity, 10);
      player.y += player.vy;
      player.x += STAGES[s].speed; // 저절로 앞으로 감
      // 올라갈 때는 고개를 들고, 떨어질 때는 고개를 숙임
      player.angle = clamp(player.vy * 0.06, -0.45, 0.8);

      // 천장에 닿으면 더 못 올라감
      if (player.y < 20) {
        player.y = 20;
        player.vy = 0;
      }
      // 바닥에 떨어지면 게임 오버
      if (s < 4 && player.y + 12 > H - GROUND) return gameOver("바닥에 떨어졌어요");
      if (s === 4 && player.y > H + 30) return gameOver("우주로 떠내려갔어요");

      // 파이프에 부딪히기 (고양이 크기보다 살짝 작게 검사 = 조금 봐주기)
      const bx = player.x - 16;
      const by = player.y - 14;
      const bw = 32;
      const bh = 24;
      for (const p of pipes) {
        if (p.x > bx + bw || p.x + PIPE_W < bx - 200) continue;
        const gy = gapCenter(p);
        if (bx + bw > p.x && bx < p.x + PIPE_W && (by < gy - p.gap / 2 || by + bh > gy + p.gap / 2)) {
          return gameOver("파이프에 부딪혔어요");
        }
        if (!p.passed && p.x + PIPE_W < bx) {
          p.passed = true;
          score++;
        }
      }
      best = Math.max(best, score);

      // 카메라가 고양이를 따라가기
      camX = clamp(player.x - CAT_X, 0, worldEnd - W);

      // 새 스테이지 도착
      if (s > stageIndex) {
        stageIndex = s;
        bannerTimer = 150;
      }
      if (bannerTimer > 0) bannerTimer--;

      showInfo();

      // 별에 닿으면 클리어
      if (player.x >= star.x - 20) gameClear();
    }

    function showInfo() {
      stageText.textContent = STAGES[stageAt(player.x)].name;
      scoreText.textContent = score;
      bestText.textContent = best;
    }

    // =====================================================
    // ===== 그리기 =====
    // =====================================================

    // ----- 고양이 (검정·흰색 턱시도 고양이) -----
    // 시작 화면 그림과 같은 모양을 작게 줄여서 그려요
    function drawCat(x, y, face, o) {
      const S = 0.27;
      const black = "#23232b";                  // 검은 털
      const white = "#fafafa";                  // 흰 털
      const line = o.dark ? "#9aa3c0" : "#111"; // 테두리 (어두운 하늘에서는 밝게 해서 잘 보이게)
      const body = o.suit ? "#eef3fb" : black;
      const bodyBack = o.suit ? "#d5deea" : "#15151b"; // 뒤쪽 다리는 조금 더 어둡게

      // 타원 하나 그리기 (자주 써서 따로 만듦)
      function oval(cx, cy, rx, ry, fill, stroke) {
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) ctx.stroke();
      }
      // 세모 하나 그리기
      function tri(p, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); ctx.lineTo(p[4], p[5]);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) ctx.stroke();
      }

      ctx.save();
      ctx.translate(x - face * 8, y - 52 * S); // 머리가 벽에 파묻히지 않게 살짝 뒤로
      ctx.scale(face * S, S);
      ctx.lineWidth = 4;
      ctx.strokeStyle = line;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // 꼬리 (끝만 하얀색)
      const wag = Math.sin(time * 0.15) * 8;
      for (const [w, color] of [[18, line], [12, black]]) {
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(-50, -8);
        ctx.quadraticCurveTo(-104, -20 + wag, -90, -80 + wag);
        ctx.stroke();
      }
      ctx.strokeStyle = line;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(-90, -84 + wag, 8, 0, Math.PI * 2);
      ctx.fillStyle = white;
      ctx.fill();
      ctx.stroke();
      ctx.lineWidth = 4;

      // 우주복 가방
      if (o.suit) {
        ctx.fillStyle = "#9aa7bd";
        ctx.beginPath();
        ctx.roundRect(-50, -62, 44, 40, 10);
        ctx.fill();
        ctx.stroke();
      }

      // 다리 4개 (대각선끼리 같이 움직여요) + 하얀 양말
      const a = Math.sin(o.walk) * 0.55;
      const legs = o.air
        ? [[-28, 0.5, bodyBack], [40, -0.5, bodyBack], [-44, 0.5, body], [24, -0.5, body]]
        : [[-28, -a, bodyBack], [40, a, bodyBack], [-44, a, body], [24, -a, body]];
      for (const [lx, ang, color] of legs) {
        ctx.save();
        ctx.translate(lx, 10);
        ctx.rotate(ang);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(-7, 0, 14, 38, 7);
        ctx.fill();
        ctx.stroke();
        oval(0, 40, 9, 7, white, true);
        ctx.restore();
      }

      // 몸통 (검정) + 하얀 배와 가슴
      oval(0, 0, 60, 32, body, true);
      if (!o.suit) {
        ctx.save();
        oval(0, 0, 60, 32);
        ctx.clip(); // 몸통 밖으로 삐져나가지 않게
        oval(14, 22, 40, 16, white);
        oval(46, 4, 18, 22, white);
        ctx.restore();
        oval(0, 0, 60, 32, null, true);
      }

      // 뾰족한 귀 (안쪽은 분홍)
      tri([36, -52, 40, -94, 64, -62], black, true);
      tri([70, -64, 94, -92, 96, -46], black, true);
      tri([43, -60, 45, -82, 58, -64], "#ffb3c1");
      tri([76, -64, 90, -82, 91, -54], "#ffb3c1");

      // 얼굴 (검정) + 하얀 코줄무늬와 주둥이
      oval(64, -30, 38, 33, black, true);
      ctx.save();
      oval(64, -30, 38, 33);
      ctx.clip(); // 얼굴 밖으로 삐져나가지 않게
      ctx.fillStyle = white;
      ctx.beginPath();
      ctx.moveTo(62, -56); ctx.lineTo(68, -56); ctx.lineTo(78, -18); ctx.lineTo(56, -18);
      ctx.fill();
      oval(67, -12, 22, 13, white);
      ctx.restore();
      oval(64, -30, 38, 33, null, true);

      // 눈 (연두색에 세로로 긴 눈동자, 가끔 깜빡)
      const blink = time % 200 < 8;
      for (const ex of [52, 80]) {
        if (blink || o.hurt) {
          ctx.strokeStyle = "#e8e8f0";
          ctx.lineWidth = 3;
          ctx.beginPath();
          if (o.hurt) { // 아플 때는 > < 눈
            const d = ex === 52 ? 1 : -1;
            ctx.moveTo(ex - 6 * d, -42); ctx.lineTo(ex + 6 * d, -34); ctx.lineTo(ex - 6 * d, -26);
          } else {
            ctx.moveTo(ex - 7, -34); ctx.lineTo(ex + 7, -34);
          }
          ctx.stroke();
        } else {
          ctx.lineWidth = 2;
          oval(ex, -34, 7.5, 8.5, "#d4e85a", true);
          oval(ex + 1, -34, 2.4, 6.5, "#111");
          oval(ex - 2, -38, 2, 2, "#fff");
        }
      }
      ctx.strokeStyle = line;

      // 볼, 코, 입
      oval(52, -12, 5, 3, "rgba(255,143,168,0.5)");
      oval(84, -12, 5, 3, "rgba(255,143,168,0.5)");
      tri([63, -22, 73, -22, 68, -16], "#ff8fa8");
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(68, -16); ctx.lineTo(68, -12);
      ctx.moveTo(62, -11);
      ctx.quadraticCurveTo(65, -7, 68, -12);
      ctx.quadraticCurveTo(71, -7, 74, -11);
      ctx.stroke();

      // 수염 (양쪽에)
      ctx.strokeStyle = "#cfcfd8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(88, -16); ctx.lineTo(114, -22);
      ctx.moveTo(88, -12); ctx.lineTo(116, -12);
      ctx.moveTo(88, -8); ctx.lineTo(112, -2);
      ctx.moveTo(48, -16); ctx.lineTo(24, -22);
      ctx.moveTo(48, -10); ctx.lineTo(22, -8);
      ctx.stroke();

      // 우주 헬멧
      if (o.suit) {
        ctx.fillStyle = "rgba(170,215,255,0.25)";
        ctx.strokeStyle = "#d6ecff";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(66, -38, 60, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(66, -38, 46, Math.PI * 1.1, Math.PI * 1.45);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ----- 배경 -----
    function drawStageBg(s) {
      const sky = [
        ["#070b24", "#28305e"], // 산속: 밤하늘
        ["#ffc98f", "#ffeccc"],
        ["#4f9ee8", "#cbe7ff"],
        ["#0b1340", "#2a2f6e"],
        ["#000000", "#140a2a"],
      ][s];
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, sky[0]);
      grad.addColorStop(1, sky[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      if (s === 0) {
        // 반짝이는 작은 별들
        const offS = camX * 0.03;
        for (let i = 0; i < 90; i++) {
          const sx = ((prand(i + 500) * W * 2 - offS) % (W * 2) + W * 2) % (W * 2) - W / 2;
          const sy = prand(i + 1500) * H * 0.6;
          ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.6 * Math.abs(Math.sin(time * 0.03 + i))})`;
          ctx.fillRect(sx, sy, 2, 2);
        }
        // 달
        const moonX = 140 - camX * 0.02;
        const moonGlow = ctx.createRadialGradient(moonX, 90, 20, moonX, 90, 90);
        moonGlow.addColorStop(0, "rgba(255,248,210,0.35)");
        moonGlow.addColorStop(1, "rgba(255,248,210,0)");
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(moonX, 90, 90, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff8d2";
        ctx.beginPath();
        ctx.arc(moonX, 90, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(200,190,150,0.5)"; // 달 무늬
        ctx.beginPath();
        ctx.arc(moonX - 9, 82, 6, 0, Math.PI * 2);
        ctx.arc(moonX + 8, 98, 4, 0, Math.PI * 2);
        ctx.fill();

        // 먼 산 (밤이라 어두운 색)
        const off = camX * 0.15;
        for (let i = Math.floor(off / 220) - 1; i < Math.floor(off / 220) + 6; i++) {
          const mx = i * 220 - off;
          const mh = 140 + prand(i) * 110;
          ctx.fillStyle = "#26365a";
          ctx.beginPath();
          ctx.moveTo(mx - 160, H);
          ctx.lineTo(mx, H - 120 - mh);
          ctx.lineTo(mx + 160, H);
          ctx.fill();
          ctx.fillStyle = "#b9c3e0"; // 달빛 받은 눈
          ctx.beginPath();
          ctx.moveTo(mx - 28, H - 120 - mh + 34);
          ctx.lineTo(mx, H - 120 - mh);
          ctx.lineTo(mx + 28, H - 120 - mh + 34);
          ctx.fill();
        }
        // 가까운 소나무
        const off2 = camX * 0.4;
        ctx.fillStyle = "#16302e"; // 어두운 소나무
        for (let i = Math.floor(off2 / 70) - 1; i < Math.floor(off2 / 70) + 14; i++) {
          const tx = i * 70 - off2;
          const th = 60 + prand(i + 50) * 50;
          ctx.beginPath();
          ctx.moveTo(tx - 22, H - 40);
          ctx.lineTo(tx, H - 40 - th);
          ctx.lineTo(tx + 22, H - 40);
          ctx.fill();
        }
      }

      if (s === 1) {
        // 먼 빌딩 숲
        const off = camX * 0.25;
        for (let i = Math.floor(off / 60) - 1; i < Math.floor(off / 60) + 16; i++) {
          const bx = i * 60 - off;
          const bh = 120 + prand(i) * 170;
          ctx.fillStyle = "#b8a3c9";
          ctx.fillRect(bx, H - bh, 52, bh);
          ctx.fillStyle = "rgba(255,240,200,0.6)";
          for (let wy = H - bh + 12; wy < H - 20; wy += 22) {
            if (prand(i * 7 + wy) > 0.5) ctx.fillRect(bx + 8, wy, 10, 10);
            if (prand(i * 9 + wy) > 0.5) ctx.fillRect(bx + 32, wy, 10, 10);
          }
        }
      }

      if (s === 2) {
        // 구름 (가까이)
        const off = camX * 0.3;
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        for (let i = Math.floor(off / 260) - 1; i < Math.floor(off / 260) + 5; i++) {
          const cx = i * 260 - off;
          const cy = 70 + prand(i) * 160;
          for (let k = 0; k < 4; k++) {
            ctx.beginPath();
            ctx.ellipse(cx + k * 26, cy + (k % 2) * 8, 32, 20, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        // 저 아래 작게 보이는 도시
        const off2 = camX * 0.1;
        ctx.fillStyle = "rgba(90,110,160,0.35)";
        for (let i = Math.floor(off2 / 30) - 1; i < Math.floor(off2 / 30) + 30; i++) {
          const bh = 20 + prand(i + 300) * 50;
          ctx.fillRect(i * 30 - off2, H - bh, 26, bh);
        }
      }

      if (s >= 3) {
        // 반짝이는 별
        const off = camX * 0.05;
        for (let i = 0; i < 140; i++) {
          const sx = ((prand(i) * W * 2 - off) % (W * 2) + W * 2) % (W * 2) - W / 2;
          const sy = prand(i + 1000) * H;
          ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.03 + i));
          ctx.fillStyle = "#fff";
          ctx.fillRect(sx, sy, prand(i + 2000) * 2 + 1, prand(i + 2000) * 2 + 1);
        }
        ctx.globalAlpha = 1;
      }
      if (s === 3) {
        // 저 아래 지구
        const earth = ctx.createRadialGradient(W / 2, H + 900, 900, W / 2, H + 900, 1000);
        earth.addColorStop(0, "#3a7bd5");
        earth.addColorStop(0.9, "#7fd1ff");
        earth.addColorStop(1, "rgba(127,209,255,0)");
        ctx.fillStyle = earth;
        ctx.beginPath();
        ctx.arc(W / 2, H + 900, 1000, 0, Math.PI * 2);
        ctx.fill();
      }
      if (s === 4) {
        // 멀리 보이는 행성
        const px = 600 - camX * 0.02 % 1600;
        ctx.fillStyle = "#c084fc";
        ctx.beginPath();
        ctx.arc(px, 120, 50, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,220,150,0.7)";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.ellipse(px, 120, 85, 18, -0.3, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 산속~우주선: 하늘의 별이 앞에서 도망가고, 갈수록 점점 커지는 느낌
      if (s <= 3) drawSkyStar(clamp(camX / (star.x - W), 0, 1));
    }

    // 하늘에 떠서 도망가는 별 (t: 0 = 처음, 1 = 거의 다 옴)
    function drawSkyStar(t) {
      const x = W * 0.75 + Math.sin(time * 0.02) * 20;
      const y = 60 + Math.sin(time * 0.05) * 6;
      const r = 15 + t * 22; // 가까워질수록 커져요
      // 뒤에 남는 반짝이 꼬리
      for (let i = 1; i <= 6; i++) {
        ctx.fillStyle = `rgba(255,230,120,${0.5 - i * 0.07})`;
        ctx.beginPath();
        ctx.arc(x - i * (12 + t * 8), y + i * 3 + Math.sin(time * 0.1 + i) * 4, r * 0.35 * (1 - i / 8), 0, Math.PI * 2);
        ctx.fill();
      }
      // 은은한 빛
      const glow = ctx.createRadialGradient(x, y, 2, x, y, r * 3);
      glow.addColorStop(0, "rgba(255,230,120,0.7)");
      glow.addColorStop(1, "rgba(255,230,120,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, r * 3, 0, Math.PI * 2);
      ctx.fill();
      // 별 모양
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(time * 0.02);
      ctx.fillStyle = "#ffd166";
      ctx.strokeStyle = "#ff9f1c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const rr = k % 2 === 0 ? r : r * 0.45;
        const ang = (k * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawBackground() {
      // 스테이지가 바뀌는 곳에서는 두 배경을 부드럽게 섞기
      const cx = camX + W / 2;
      const s = stageAt(cx);
      const next = s + 1 < stageStarts.length ? stageStarts[s + 1] : Infinity;
      const BLEND = 500;
      const t = clamp((cx - (next - BLEND)) / BLEND, 0, 1);
      drawStageBg(s);
      if (t > 0) {
        ctx.globalAlpha = t;
        drawStageBg(s + 1);
        ctx.globalAlpha = 1;
      }
    }

    // ----- 바닥 (산속 흙길 → 도시 도로 → 옥상 → 우주선 갑판) -----
    function drawGround() {
      const y = H - GROUND;
      for (let s = 0; s < 4; s++) {
        const a = Math.max(stageStarts[s] - camX, 0);
        const b = Math.min(stageStarts[s + 1] - camX, W);
        if (b <= a) continue;
        ctx.save();
        ctx.beginPath();
        ctx.rect(a, y, b - a, GROUND);
        ctx.clip();
        const first = Math.floor((a + camX) / 40) * 40 - camX; // 무늬가 땅과 같이 움직이게
        if (s === 0) {
          ctx.fillStyle = "#3e2c22";
          ctx.fillRect(a, y, b - a, GROUND);
          ctx.fillStyle = "#24503a";
          ctx.fillRect(a, y, b - a, 10);
          ctx.fillStyle = "rgba(0,0,0,0.12)";
          for (let x = first; x < b; x += 40) ctx.fillRect(x + 12, y + 20, 8, 6);
        } else if (s === 1) {
          ctx.fillStyle = "#4b505a";
          ctx.fillRect(a, y, b - a, GROUND);
          ctx.fillStyle = "#b8bec8";
          ctx.fillRect(a, y, b - a, 8);
          ctx.fillStyle = "#ffd166";
          for (let x = first; x < b; x += 40) ctx.fillRect(x + 10, y + 24, 20, 4);
        } else if (s === 2) {
          ctx.fillStyle = "#6d7fa8";
          ctx.fillRect(a, y, b - a, GROUND);
          ctx.fillStyle = "rgba(0,0,0,0.3)";
          ctx.fillRect(a, y, b - a, 8);
          ctx.fillStyle = "rgba(255,240,180,0.7)";
          for (let x = first; x < b; x += 40) ctx.fillRect(x + 14, y + 16, 12, 14);
        } else {
          ctx.fillStyle = "#5b6b8c";
          ctx.fillRect(a, y, b - a, GROUND);
          // 노랑/검정 줄무늬
          for (let x = first; x < b; x += 16) {
            ctx.fillStyle = Math.round((x + camX) / 16) % 2 ? "#222" : "#ffd166";
            ctx.fillRect(x, y, 16, 6);
          }
          ctx.fillStyle = "#8fa3c7";
          for (let x = first; x < b; x += 40) {
            ctx.beginPath();
            ctx.arc(x + 20, y + 22, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }
    }

    // ----- 파이프 (스테이지마다 색이 달라요) -----
    const PIPE_STYLE = [
      null, // 산속: 파이프 대신 나무 (treePart로 따로 그려요)
      { light: "#d3d8e0", body: "#9aa1ad", dark: "#686f7c", line: "#3a404b" }, // 도시: 쇠 파이프
      { light: "#f5a982", body: "#d9734a", dark: "#a14e2c", line: "#5a2712" }, // 옥상: 벽돌 굴뚝
      { light: "#a9bbdb", body: "#6f80a3", dark: "#45557a", line: "#1f2a42" }, // 우주선: 금속 기둥
      { light: "#e2c8ff", body: "#a970e8", dark: "#6e3db8", line: "#3a1a6a" }, // 우주: 수정 기둥
    ];

    // 파이프 한 쪽 (몸통 + 입구 뚜껑)
    function pipePart(x, y0, y1, capY, st, s) {
      const shade = (x0, x1) => {
        const g = ctx.createLinearGradient(x0, 0, x1, 0);
        g.addColorStop(0, st.light);
        g.addColorStop(0.45, st.body);
        g.addColorStop(1, st.dark);
        return g;
      };
      ctx.strokeStyle = st.line;
      ctx.lineWidth = 3;
      ctx.fillStyle = shade(x, x + PIPE_W);
      ctx.fillRect(x, y0, PIPE_W, y1 - y0);
      ctx.strokeRect(x, y0, PIPE_W, y1 - y0);
      if (s === 2) {
        // 벽돌 줄
        ctx.strokeStyle = "rgba(90,39,18,0.35)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let by = y0 + 18; by < y1; by += 18) {
          ctx.moveTo(x, by);
          ctx.lineTo(x + PIPE_W, by);
        }
        ctx.stroke();
        ctx.strokeStyle = st.line;
        ctx.lineWidth = 3;
      }
      ctx.fillStyle = shade(x - 6, x + PIPE_W + 6);
      ctx.fillRect(x - 6, capY, PIPE_W + 12, 26);
      ctx.strokeRect(x - 6, capY, PIPE_W + 12, 26);
      if (s === 1) {
        // 볼트
        ctx.fillStyle = st.line;
        for (const bx of [x + 4, x + PIPE_W - 4]) {
          ctx.beginPath();
          ctx.arc(bx, capY + 13, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (s === 3) {
        // 깜빡이는 불빛
        ctx.fillStyle = Math.floor(time / 20) % 2 ? "#7fd1ff" : "#ff8c42";
        ctx.fillRect(x + PIPE_W / 2 - 8, capY + 10, 16, 6);
      }
    }

    // 산속의 나무 (줄기 + 옆가지 + 나뭇잎 덩어리)
    // y0~y1: 줄기 위치, leafY: 잎 덩어리 높이, dir: 1 = 아래에서 자란 나무, -1 = 위에서 늘어진 가지
    function treePart(x, y0, y1, leafY, dir, seed) {
      // 줄기
      const g = ctx.createLinearGradient(x + 12, 0, x + PIPE_W - 12, 0);
      g.addColorStop(0, "#7a5639");
      g.addColorStop(0.5, "#5e412b");
      g.addColorStop(1, "#3b281a");
      ctx.fillStyle = g;
      ctx.strokeStyle = "#1f140c";
      ctx.lineWidth = 3;
      ctx.fillRect(x + 12, y0, PIPE_W - 24, y1 - y0);
      ctx.strokeRect(x + 12, y0, PIPE_W - 24, y1 - y0);
      // 나무껍질 무늬
      ctx.strokeStyle = "rgba(31,20,12,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let by = y0 + 20; by < y1 - 20; by += 34) {
        ctx.moveTo(x + 22, by);
        ctx.quadraticCurveTo(x + 28, by + 8, x + 23, by + 16);
        ctx.moveTo(x + 44, by + 14);
        ctx.quadraticCurveTo(x + 50, by + 22, x + 45, by + 30);
      }
      ctx.stroke();

      // 옆으로 뻗은 작은 가지 (줄기가 길 때만)
      if (Math.abs(y1 - y0) > 120) {
        const side = prand(seed) > 0.5 ? 1 : -1;
        const sx = side > 0 ? x + PIPE_W - 12 : x + 12;
        const sy = leafY + dir * 75;
        const ex = side > 0 ? x + PIPE_W + 2 : x - 2;
        const ey = sy - dir * 16;
        ctx.strokeStyle = "#4a3322";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        ctx.fillStyle = "#2f6b3e";
        ctx.beginPath();
        ctx.arc(ex, ey, 9, 0, Math.PI * 2);
        ctx.fill();
      }

      // 나뭇잎 덩어리: 테두리 → 잎 → 달빛 받은 밝은 부분 순서로 겹쳐 그리기
      const leaves = [[4, 0, 14], [18, -5, 16], [35, -7, 17], [52, -5, 16], [66, 0, 14], [26, 6, 14], [44, 6, 14]];
      for (const [color, grow, dx, dy] of [["#132a1b", 3, 0, 0], ["#2f6b3e", 0, 0, 0], ["#4f9a5a", -7, -3, -4]]) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (const [lx, ly, r] of leaves) {
          ctx.moveTo(x + lx + dx + r + grow, leafY + ly * dir + dy);
          ctx.arc(x + lx + dx, leafY + ly * dir + dy, r + grow, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    }

    function drawPipe(p) {
      const x = p.x - camX;
      const gy = gapCenter(p);
      const top = gy - p.gap / 2;
      const bot = gy + p.gap / 2;
      if (p.stage === 0) {
        treePart(x, -10, top - 10, top - 16, -1, p.x);    // 위에서 늘어진 가지
        treePart(x, bot + 10, H + 10, bot + 16, 1, p.x + 7); // 아래에서 자란 나무
        return;
      }
      const st = PIPE_STYLE[p.stage];
      if (p.stage === 4) {
        // 우주의 수정 기둥은 은은하게 빛나요
        ctx.save();
        ctx.shadowColor = "#d6b4ff";
        ctx.shadowBlur = 18;
      }
      pipePart(x, -10, top, top - 26, st, p.stage);  // 위 파이프
      pipePart(x, bot, H + 10, bot, st, p.stage);    // 아래 파이프
      if (p.stage === 4) ctx.restore();
    }

    function drawStar() {
      const x = star.x - camX;
      const y = star.y;
      if (x < -100 || x > W + 100) return;
      const glow = ctx.createRadialGradient(x, y, 5, x, y, 80);
      glow.addColorStop(0, "rgba(255,230,120,0.8)");
      glow.addColorStop(1, "rgba(255,230,120,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, 80, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.translate(x, y + Math.sin(time * 0.05) * 5);
      ctx.rotate(time * 0.02);
      ctx.fillStyle = "#ffd166";
      ctx.strokeStyle = "#ff9f1c";
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const r = k % 2 === 0 ? 30 : 13;
        const ang = (k * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawProgress() {
      // 위쪽 막대: 별까지 얼마나 왔는지
      const left = 30;
      const right = W - 40;
      const y = 18;
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.roundRect(left, y - 4, right - left, 8, 4);
      ctx.fill();
      // 스테이지 경계 표시
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      for (const sx of stageStarts) ctx.fillRect(left + (sx / star.x) * (right - left) - 1, y - 6, 2, 12);
      const t = clamp(player.x / star.x, 0, 1);
      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.roundRect(left, y - 4, (right - left) * t, 8, 4);
      ctx.fill();
      ctx.font = "16px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐱", left + (right - left) * t, y + 1);
      ctx.fillText("⭐", right + 16, y + 1);
      ctx.textBaseline = "alphabetic";
    }

    function drawBanner() {
      if (!playing || bannerTimer <= 0) return;
      ctx.globalAlpha = Math.min(1, bannerTimer / 30);
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 90, W, 64);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 32px 'Malgun Gothic', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const text = stageIndex === 4 ? STAGES[4].name + " · 우주복 착용!" : STAGES[stageIndex].name;
      ctx.fillText(text, W / 2, 122);
      ctx.textBaseline = "alphabetic";
      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();
      for (const p of pipes) {
        if (p.x + PIPE_W < camX - 10 || p.x > camX + W + 10) continue;
        drawPipe(p);
      }
      drawGround();
      drawStar();

      // 고양이: 올라갈 땐 고개 들고, 떨어질 땐 숙이고. 날 때는 발을 동동
      ctx.save();
      ctx.translate(player.x - camX, player.y);
      ctx.rotate(player.angle);
      drawCat(4, 14, 1, {
        walk: time * 0.7,
        air: flapAnim === 0,
        suit: stageAt(player.x) === 4,
        hurt: player.dead,
        dark: stageAt(player.x) === 0 || stageAt(player.x) >= 3, // 밤·우주에서는 테두리를 밝게
      });
      ctx.restore();

      drawProgress();
      drawBanner();
    }

    // ===== 계속 반복하기 =====
    // 모니터가 빠르든 느리든 1초에 60번만 움직이도록 맞춤
    const STEP = 1000 / 60;
    let lastTime = 0;
    let acc = 0;
    function loop(now) {
      if (!playing) return;
      acc += Math.min(now - lastTime, 100);
      lastTime = now;
      while (acc >= STEP && playing) {
        update();
        acc -= STEP;
      }
      draw();
      if (playing) requestAnimationFrame(loop);
    }

    // ===== 시작 / 끝 =====
    function startGame() {
      resetGame();
      overlay.classList.add("hidden");
      playMusic();
      playing = true;
      flapQueued = true; // 시작하자마자 한 번 폴짝
      acc = 0;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function endScreen(title, color, text) {
      playing = false;
      endTime = performance.now();
      draw();
      message.textContent = title;
      message.style.color = color;
      sub.innerHTML = text;
      titleScreen.classList.add("hidden");
      message.classList.remove("hidden");
      sub.classList.remove("hidden");
      startBtn.classList.remove("hidden");
      overlay.classList.remove("hidden");
    }

    function gameOver(reason) {
      player.dead = true;
      endScreen("게임 오버", "#ff6b6b",
        `<b style="font-size:30px">다시 날아보자!</b><br>${STAGES[stageAt(player.x)].name}에서 ${reason}<br>파이프 ${score}개 통과 · 최고 ${best}`);
    }

    function gameClear() {
      score += 10;
      best = Math.max(best, score);
      showInfo();
      endScreen("클리어!!", "#ffd166", `별을 잡았어요! ⭐<br>점수 ${score} (별 보너스 +10)`);
    }

    startBtn.addEventListener("click", () => {
      startBtn.blur(); // 스페이스가 버튼을 또 누르지 않게
      startGame();
    });
    startCat.addEventListener("click", startGame);

    // 처음 화면
    resetGame();
    draw();
  </script>
</body>
</html>

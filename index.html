<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임 모음</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      box-sizing: border-box;
      background: #0b1026;
      color: #fff;
      font-family: "Malgun Gothic", sans-serif;
    }
    h1 { margin: 0 0 6px; font-size: 34px; }
    p { margin: 0 0 28px; color: #aab; }
    .games {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 960px;
    }
    /* 게임 카드 하나 */
    a.card {
      width: 250px;
      padding: 24px 20px;
      border-radius: 16px;
      background: #1a2148;
      border: 3px solid #2b3467;
      color: #fff;
      text-decoration: none;
      text-align: center;
      transition: transform 0.15s, border-color 0.15s;
    }
    a.card:hover { transform: translateY(-6px); border-color: #ffd166; }
    .icon { font-size: 56px; }
    .name { margin: 10px 0 6px; font-size: 24px; font-weight: bold; color: #ffd166; }
    .desc { font-size: 15px; line-height: 1.6; color: #ccd; }
  </style>
</head>
<body>
  <h1>🎮 게임 모음</h1>
  <p>하고 싶은 게임을 눌러 주세요</p>

  <div class="games">
    <a class="card" href="위로/index.html">
      <div class="icon">🧱</div>
      <div class="name">위로!</div>
      <div class="desc">공을 튕겨 벽돌을 깨요.<br>땅속에서 우주까지 올라가요.</div>
    </a>
    <a class="card" href="별을향해/index.html">
      <div class="icon">🐱</div>
      <div class="name">별을 향해</div>
      <div class="desc">턱시도 고양이가 폴짝 날아<br>나무와 파이프 사이를 지나가요.</div>
    </a>
    <a class="card" href="로봇출격/index.html">
      <div class="icon">🤖</div>
      <div class="name">로봇 출격!</div>
      <div class="desc">로봇을 타고 우주선과<br>운석을 부수는 슈팅 게임이에요.</div>
    </a>
  </div>
</body>
</html>

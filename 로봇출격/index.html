<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로봇 출격!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #05060f;
      color: #fff;
      font-family: "Malgun Gothic", sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    #wrap { position: relative; }
    canvas {
      display: block;
      height: min(82vh, 640px);
      max-width: 95vw;
      border: 4px solid #2b3467;
      border-radius: 10px;
      background: #000;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      background: rgba(0, 0, 10, 0.6);
      border-radius: 10px;
    }
    #message { font-size: 48px; font-weight: bold; color: #38e1ff; }
    #sub { font-size: 18px; line-height: 1.7; padding: 0 20px; }
    #startBtn {
      font-size: 24px;
      padding: 12px 36px;
      border: none;
      border-radius: 10px;
      background: #38e1ff;
      color: #05060f;
      font-weight: bold;
      cursor: pointer;
    }
    #startBtn:hover { background: #8ff0ff; }
    #help { margin-top: 8px; font-size: 14px; color: #aab; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <a href="../index.html" style="position:fixed;top:12px;left:16px;color:#aab;font-size:14px;text-decoration:none;z-index:10">← 게임 목록</a>
  <h1>🤖 로봇 출격!</h1>
  <div id="wrap">
    <canvas id="game" width="700" height="640"></canvas>
    <div id="overlay">
      <div id="message">로봇 출격!</div>
      <div id="sub">
        우주선을 타고 고향으로 돌아가던 길,<br>
        갑자기 <b style="color:#ff5d7a">우주 해적</b>이 나타났다!<br>
        화물칸에 실려 있던 로봇을 타고 출격해서<br>
        <b style="color:#ffd166">우리 우주선을 지켜라!</b><br>
        <span style="font-size:15px;color:#aab">목숨 3개 · 위급할 땐 Space로 우주선 지원 사격</span>
      </div>
      <button id="startBtn">출격!</button>
    </div>
  </div>
  <div id="help">방향키 이동 · Shift 누르는 동안 천천히 · Space 우주선 지원 사격 · 총은 자동으로 쏴요</div>

  <script>
    // ===== 기본 준비 =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = 480;              // 게임 화면 너비 (왼쪽)
    const H = canvas.height;
    const PANEL_X = W;          // 오른쪽 점수판이 시작하는 곳
    const PANEL_W = canvas.width - W;
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");
    const sub = document.getElementById("sub");
    const startBtn = document.getElementById("startBtn");

    // ===== 설정 값 =====
    const SPEED = 4.5;       // 로봇 이동 속도
    const SLOW_SPEED = 1.8;  // Shift 누를 때 속도
    const FIRE_GAP = 5;      // 몇 프레임마다 총을 쏠지 (작을수록 빨리)
    const LIVES = 3;         // 처음 목숨 개수
    const BOSS_AT = 3500;    // 보스가 나오는 시간 (60 = 1초)

    // 스테이지 목록: ready가 true인 것만 만들어져 있어요. 나머지는 제작 예정!
    const STAGES = [
      { name: "해적의 습격",   ready: true },
      { name: "운석 지대",     ready: false },
      { name: "해적 기지 앞", ready: false },
      { name: "얼음 행성",     ready: false },
      { name: "고향 하늘",    ready: false },
    ];

    // ===== 게임 상태 =====
    // title: 시작 화면, drop: 우주선에서 로봇이 내리는 중, play: 게임 중,
    // dying: 맞아서 터지는 중, clearing: 보스를 부숴서 터지는 중, end: 끝 화면
    let state = "title";
    let frame = 0;        // 화면이 그려진 횟수 (애니메이션용)
    let stageIndex = 0;   // 지금 스테이지 (0 = 스테이지 1)
    let stageT = 0;       // 스테이지가 시작하고 지난 시간
    let dropT = 0;        // 로봇이 내리는 장면이 시작하고 지난 시간
    let endT = 0;         // 터지는 장면 남은 시간
    let score = 0;
    let best = 0;
    let lives = LIVES;    // 남은 목숨
    let bombs = 1;        // 지원 사격 남은 횟수 (죽으면 다시 1개)
    let support = null;   // 지원 사격 중이면 그 정보
    let invuln = 0;       // 다시 내려온 뒤 잠깐 무적인 시간
    let warning = 0;      // 보스 경고 남은 시간
    let banner = null;    // 화면 가운데 큰 글자 { top, big, t }
    let shake = 0;        // 화면 흔들림
    let timeline = [];    // 언제 어떤 적이 나올지 적어 둔 목록
    let endShownAt = 0;

    const player = { x: W / 2, y: H - 110, r: 3, tilt: 0, visible: false };
    const carrier = { x: W / 2, y: -150, hatch: 0 }; // 로봇을 내려 주는 우리 편 우주선
    let bullets = [];   // 로봇의 총알
    let enemies = [];   // 적 (전투기, 큰 적함, 운석, 보스)
    let eBullets = [];  // 적의 총알
    let particles = []; // 폭발 불꽃
    const keys = { left: false, right: false, up: false, down: false, slow: false };

    // 배경의 별 (빠른 별은 가까이, 느린 별은 멀리 있는 느낌)
    const stars = [];
    for (let i = 0; i < 130; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: 0.4 + Math.random() * 2.6 });
    }

    // 최고 점수 불러오기 (브라우저가 막으면 그냥 0)
    try { best = Number(localStorage.getItem("robotBest")) || 0; } catch (e) {}

    // ===== 작은 도움 함수 =====
    function rand(a, b) { return a + Math.random() * (b - a); }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOut(t) { return 1 - (1 - t) * (1 - t); }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    // =====================================================
    // ===== 적 만들기 =====
    // =====================================================

    // 적 총알 한 발
    function shoot(x, y, angle, speed, color, r = 5) {
      eBullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r, color });
    }
    // 로봇 쪽을 향하는 각도
    function aim(x, y) {
      return Math.atan2(player.y - y, player.x - x);
    }

    // 운석 (큰 운석은 부수면 작은 운석 2개로 갈라져요)
    function spawnMeteor(big, x = rand(30, W - 30), y = -40, vx = rand(-0.6, 0.6)) {
      const r = big ? 26 : 13;
      const shape = [];
      for (let i = 0; i < 9; i++) shape.push(rand(0.75, 1.1)); // 울퉁불퉁한 모양
      enemies.push({
        type: "meteor", big, x, y, vx, vy: rand(1.2, 2.4), r, hp: big ? 10 : 3,
        score: big ? 150 : 50, rot: 0, spin: rand(-0.03, 0.03), shape, t: 0, wait: 0, flash: 0,
      });
    }

    // 작은 전투기 5대가 줄지어 내려옴 (side: "L" 왼쪽, "R" 오른쪽)
    function fighterLine(side) {
      const x0 = side === "L" ? 110 : W - 110;
      for (let k = 0; k < 5; k++) {
        enemies.push({
          type: "fighter", x: x0, y: -20, x0, swing: side === "L" ? 70 : -70, r: 14, hp: 3, score: 100,
          t: 0, wait: k * 16, flash: 0,
          fireGap: stageT > 1800 ? 60 : 85, fireAt: Math.floor(rand(20, 60)),
        });
      }
    }

    // 큰 적함: 내려와서 잠깐 멈추고, 부채꼴로 총알을 뿌린 뒤 돌아감
    function spawnShooter(x) {
      enemies.push({
        type: "shooter", x, y: -40, stopY: rand(110, 170), r: 24, hp: 18, score: 300,
        t: 0, wait: 0, flash: 0, mode: "in", stay: 0,
      });
    }

    // 보스: 거대한 적 모함
    function spawnBoss() {
      enemies.push({
        type: "boss", x: W / 2, y: -110, r: 55, hp: 450, maxHp: 450, score: 5000,
        t: 0, wait: 0, flash: 0, spin: 0,
      });
    }

    // 스테이지 1 시간표: 몇 초에 무엇이 나올지
    function buildTimeline() {
      const tl = [];
      const add = (at, fn) => tl.push({ at, fn });
      for (let f = 60; f < 3300; f += 75) add(f, () => spawnMeteor(Math.random() < 0.3));
      for (let i = 0; i < 13; i++) {
        const f = 180 + i * 240;
        if (i % 3 === 2) add(f, () => { fighterLine("L"); fighterLine("R"); });
        else add(f, () => fighterLine(i % 2 === 0 ? "L" : "R"));
      }
      add(900, () => spawnShooter(W / 2));
      add(1500, () => { spawnShooter(W * 0.3); spawnShooter(W * 0.7); });
      add(2100, () => { spawnShooter(W * 0.3); spawnShooter(W * 0.7); });
      add(2700, () => { spawnShooter(W * 0.2); spawnShooter(W / 2); spawnShooter(W * 0.8); });
      add(BOSS_AT - 180, () => { warning = 180; });
      add(BOSS_AT, spawnBoss);
      return tl.sort((a, b) => a.at - b.at);
    }

    // =====================================================
    // ===== 조작 =====
    // =====================================================
    document.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if (e.key === "ArrowUp") keys.up = true;
      if (e.key === "ArrowDown") keys.down = true;
      if (e.key === "Shift") keys.slow = true;
      if (e.repeat) return;
      // 시작/끝 화면에서는 엔터나 스페이스로 시작 (끝나고 0.8초는 기다리기)
      if ((state === "title" || state === "end") && (e.key === "Enter" || e.key === " ")) {
        if (performance.now() - endShownAt > 800) startGame();
        return;
      }
      if (state === "play" && e.key === " ") callSupport();
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
      if (e.key === "ArrowUp") keys.up = false;
      if (e.key === "ArrowDown") keys.down = false;
      if (e.key === "Shift") keys.slow = false;
    });
    // 다른 창을 보다 오면 키가 눌린 채로 남지 않게
    window.addEventListener("blur", () => {
      for (const k in keys) keys[k] = false;
    });

    // =====================================================
    // ===== 지원 사격 =====
    // 로봇 뒤에 있던 우리 우주선이 아래에서 올라와 레이저를 쏘아 올려요.
    // 빛의 선이 아래에서 위로 쓸고 올라가면서 적과 총알을 없애요. (보스는 큰 피해만)
    // =====================================================
    function callSupport() {
      if (bombs <= 0 || support) return;
      bombs--;
      support = { t: 0, y: H + 150, line: H + 100, id: frame, missiles: [] };
    }

    function updateSupport() {
      if (!support) return;
      const s = support;
      s.t++;
      if (s.t <= 20) s.y = lerp(H + 150, H - 50, easeOut(s.t / 20)); // 1) 올라오기
      if (s.t > 20 && s.t <= 80) {                                    // 2) 쏘아 올리기
        if (s.t === 21) shake = 18;
        s.line = lerp(s.y - 30, -30, (s.t - 20) / 60);
        // 빛의 선보다 아래에 있는 적 총알은 사라짐
        eBullets = eBullets.filter((b) => {
          if (b.y < s.line) return true;
          sparkle(b.x, b.y, b.color);
          return false;
        });
        // 빛의 선에 닿은 적은 한 번씩 큰 피해
        for (const e of enemies) {
          if (e.wait > 0 || e.dead || e.y < s.line || e.supportId === s.id) continue;
          e.supportId = s.id;
          damage(e, e.type === "boss" ? 60 : 999);
        }
        // 날아가는 미사일 (보기 좋으라고)
        if (s.t % 2 === 0) {
          for (const side of [-1, 1]) {
            s.missiles.push({ x: W / 2 + side * rand(40, 100), y: s.y - 20, vx: side * rand(0.5, 3), vy: -rand(8, 11) });
          }
        }
      }
      if (s.t > 80) s.y += (s.t - 80) * 0.6;                          // 3) 물러나기
      for (const m of s.missiles) {
        m.x += m.vx;
        m.y += m.vy;
        if (m.y < s.line) {
          m.dead = true;
          explode(m.x, m.y, 4, ["#8ff0ff", "#fff"], 2);
        }
      }
      s.missiles = s.missiles.filter((m) => !m.dead);
      if (s.t >= 115) support = null;
    }

    // =====================================================
    // ===== 움직이기 (1초에 60번) =====
    // =====================================================
    function update() {
      frame++;
      for (const s of stars) {
        s.y += s.s;
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
      }
      if (shake > 0) shake--;
      if (banner && --banner.t <= 0) banner = null;

      if (state === "drop") updateDrop();
      if (state !== "title" && state !== "end") updateGame();

      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life--;
      }
      particles = particles.filter((p) => p.life > 0);
    }

    // 출격 장면: 우주선이 내려와서 → 문이 열리고 → 로봇이 내려가고 → 우주선은 떠나요
    // 출격 장면: 아래에서 우리 우주선이 올라와 → 위쪽 화물칸 문이 열리고 → 로봇이 날아오르고 → 우주선은 뒤로 물러나요
    function startDrop() {
      state = "drop";
      dropT = 0;
      player.visible = false;
      Object.assign(carrier, { x: W / 2, y: H + 150, hatch: 0 });
    }

    function updateDrop() {
      dropT++;
      if (dropT <= 70) carrier.y = lerp(H + 150, H - 40, easeOut(dropT / 70));
      if (dropT > 70 && dropT <= 85) carrier.hatch = (dropT - 70) / 15;
      if (dropT === 86) {
        player.visible = true;
        player.x = W / 2;
      }
      if (dropT > 85 && dropT <= 140) {
        player.y = lerp(carrier.y - 25, H - 150, easeOut((dropT - 85) / 55));
      }
      if (dropT >= 140) {
        state = "play";
        invuln = 90; // 나오자마자 맞지 않게 잠깐 무적
      }
    }

    function updateGame() {
      // 로봇을 내보낸 우주선은 문을 닫고 화면 아래(로봇 뒤)로 물러나요
      if (state !== "drop" || dropT > 140) {
        carrier.hatch = Math.max(0, carrier.hatch - 0.05);
        if (carrier.y < H + 200) carrier.y += 3;
      }

      if (state === "play") {
        stageT++;
        // 시간표에 적힌 시간이 되면 적 등장
        while (timeline.length && timeline[0].at <= stageT) timeline.shift().fn();
        if (invuln > 0) invuln--;
      }
      if (state === "play" || state === "clearing") movePlayer();
      if (state === "play" && stageT % FIRE_GAP === 0) {
        // 양팔의 총에서 한 발씩, 총 2발
        bullets.push({ x: player.x - 16, y: player.y - 28 });
        bullets.push({ x: player.x + 16, y: player.y - 28 });
      }
      if (warning > 0) warning--;
      updateSupport();

      // 로봇 총알
      for (const b of bullets) b.y -= 11;

      // 적 움직이기
      for (const e of enemies) {
        if (e.wait > 0) { e.wait--; continue; }
        e.t++;
        if (e.flash > 0) e.flash--;
        if (e.type === "meteor") moveMeteor(e);
        else if (e.type === "fighter") moveFighter(e);
        else if (e.type === "shooter") moveShooter(e);
        else if (e.type === "boss") moveBoss(e);
      }

      // 로봇 총알이 적에게 맞았는지
      for (const b of bullets) {
        for (const e of enemies) {
          if (e.wait > 0 || e.dead || e.y < 0) continue;
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
            b.dead = true;
            damage(e, 1);
            break;
          }
        }
      }

      // 적 총알 움직이기
      for (const b of eBullets) {
        b.x += b.vx;
        b.y += b.vy;
      }

      // 로봇이 맞았는지 (무적이거나 지원 사격 중에는 안전)
      if (state === "play" && invuln === 0 && !support) {
        for (const b of eBullets) {
          if (dist(b, player) < b.r + player.r) return die();
        }
        for (const e of enemies) {
          if (e.wait > 0 || e.dead) continue;
          if (dist(e, player) < e.r * 0.8 + player.r) return die();
        }
      }

      // 화면 밖으로 나간 것 정리
      bullets = bullets.filter((b) => !b.dead && b.y > -20);
      eBullets = eBullets.filter((b) => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
      enemies = enemies.filter((e) => !e.dead && e.y < H + 80 && e.y > -200 && e.x > -80 && e.x < W + 80);

      // 터지는 장면이 끝나면 다음으로
      if (state === "dying" || state === "clearing") {
        endT--;
        if (state === "clearing" && endT % 8 === 0 && endT > 40) {
          explode(rand(W / 2 - 100, W / 2 + 100), rand(60, 200), 20, ["#fff", "#ffd166", "#ff7a3c"], 5);
        }
        if (endT <= 0) state === "dying" ? afterDeath() : showClear();
      }
    }

    function movePlayer() {
      const sp = keys.slow ? SLOW_SPEED : SPEED;
      const dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      const dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      const len = dx && dy ? Math.SQRT1_2 : 1; // 대각선이 더 빨라지지 않게
      player.x = clamp(player.x + dx * sp * len, 22, W - 22);
      player.y = clamp(player.y + dy * sp * len, 34, H - 26);
      player.tilt += (dx * 0.25 - player.tilt) * 0.2; // 옆으로 갈 때 살짝 기울기
    }

    function moveMeteor(e) {
      e.x += e.vx;
      e.y += e.vy;
      e.rot += e.spin;
    }

    function moveFighter(e) {
      e.y += 2.2;
      e.x = e.x0 + Math.sin(e.t * 0.035) * e.swing; // 구불구불 내려오기
      if (e.t >= e.fireAt && (e.t - e.fireAt) % e.fireGap === 0 && e.y > 20 && e.y < H * 0.6) {
        shoot(e.x, e.y + 10, aim(e.x, e.y), stageT > 1800 ? 3.6 : 3.1, "#ff5d7a");
      }
    }

    function moveShooter(e) {
      if (e.mode === "in") {
        e.y += Math.max(0.6, (e.stopY - e.y) * 0.05);
        if (e.y >= e.stopY - 1) e.mode = "stay";
      } else if (e.mode === "stay") {
        e.stay++;
        if (e.stay % 55 === 30) {
          // 로봇 쪽으로 부채꼴 5발
          const a = aim(e.x, e.y);
          for (let k = -2; k <= 2; k++) shoot(e.x, e.y + 12, a + k * 0.22, 2.8, "#c084fc");
        }
        if (e.stay > 250) e.mode = "out";
      } else {
        e.y -= 1.5;
      }
    }

    function moveBoss(e) {
      if (e.y < 130) {
        e.y += 1.6; // 천천히 등장
        return;
      }
      e.x = W / 2 + Math.sin(e.t * 0.012) * 120;
      const angry = e.hp < e.maxHp / 2; // 체력이 반 아래면 더 세게 공격
      // 빙글빙글 도는 총알
      if (e.t % (angry ? 10 : 8) === 0) {
        e.spin += 0.22;
        for (const k of [0, Math.PI]) shoot(e.x, e.y + 10, e.spin + k, 2.4, "#ff9f1c");
      }
      // 양쪽 포탑에서 로봇 쪽으로
      if (e.t % (angry ? 45 : 70) === 0) {
        for (const side of [-70, 70]) {
          const a = aim(e.x + side, e.y + 20);
          for (let k = -1; k <= 1; k++) shoot(e.x + side, e.y + 20, a + k * 0.18, angry ? 3.8 : 3.3, "#ff5d7a");
        }
      }
      // 화가 나면 사방으로 퍼지는 동그라미 총알
      if (angry && e.t % 70 === 0) {
        for (let k = 0; k < 18; k++) shoot(e.x, e.y + 10, (k / 18) * Math.PI * 2 + e.t * 0.01, 2.2, "#ff5dd6", 6);
      }
    }

    // 적에게 피해 주기
    function damage(e, n) {
      if (e.dead) return;
      e.hp -= n;
      e.flash = 3;
      if (e.hp > 0) return;
      e.dead = true;
      score += e.score;
      if (e.type === "boss") return bossDown(e);
      if (e.type === "meteor") {
        explode(e.x, e.y, e.big ? 18 : 8, ["#c9b8a3", "#8b7b6b", "#ffd166"], 3);
        if (e.big) { // 큰 운석은 작은 운석 2개로 갈라짐
          spawnMeteor(false, e.x - 10, e.y, -1.2);
          spawnMeteor(false, e.x + 10, e.y, 1.2);
        }
      } else {
        explode(e.x, e.y, e.type === "shooter" ? 30 : 14, ["#fff", "#ffd166", "#ff7a3c"], 4);
        shake = Math.max(shake, e.type === "shooter" ? 8 : 3);
      }
    }

    function bossDown(e) {
      state = "clearing";
      endT = 150;
      shake = 40;
      for (const b of eBullets) sparkle(b.x, b.y, b.color);
      eBullets = [];
      for (const o of enemies) if (o !== e) { o.dead = true; explode(o.x, o.y, 10, ["#fff", "#ffd166"], 3); }
      explode(e.x, e.y, 80, ["#fff", "#ffd166", "#ff7a3c", "#ff5d7a"], 7);
    }

    function die() {
      state = "dying";
      endT = 90;
      lives--;
      player.visible = false;
      shake = 25;
      explode(player.x, player.y, 50, ["#fff", "#38e1ff", "#ffd166"], 5);
    }

    // 터진 뒤: 목숨이 남았으면 우주선이 새 로봇을 내려 주고, 지원 사격도 다시 채워져요
    function afterDeath() {
      if (lives <= 0) return showLose();
      bombs = 1;
      bullets = [];
      for (const b of eBullets) sparkle(b.x, b.y, b.color);
      eBullets = [];
      banner = { top: "화물칸의 예비 로봇 출동! (남은 목숨 " + lives + ")", big: "다시 출격!", t: 150 };
      startDrop();
    }

    // 폭발 불꽃 만들기
    function explode(x, y, n, colors, power) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * power;
        const life = rand(20, 45);
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life,
                         color: colors[i % colors.length], size: rand(2, 5) });
      }
    }
    function sparkle(x, y, color) {
      particles.push({ x, y, vx: 0, vy: -0.5, life: 25, max: 25, color, size: 4 });
    }

    // =====================================================
    // ===== 그리기 =====
    // =====================================================

    // 둥근 네모를 칠하고 테두리 그리기
    function box(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
      ctx.stroke();
    }

    function drawBackground() {
      // 우주 + 은은한 성운
      ctx.fillStyle = "#05060f";
      ctx.fillRect(0, 0, W, H);
      const neb = ctx.createRadialGradient(W * 0.3, H * 0.35, 10, W * 0.3, H * 0.35, 320);
      neb.addColorStop(0, "rgba(90,60,170,0.35)");
      neb.addColorStop(1, "rgba(90,60,170,0)");
      ctx.fillStyle = neb;
      ctx.fillRect(0, 0, W, H);
      // 천천히 지나가는 행성
      const py = ((frame * 0.15) % (H + 500)) - 250;
      ctx.fillStyle = "#3a4a8a";
      ctx.beginPath();
      ctx.arc(W * 0.85, py, 70, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.beginPath();
      ctx.arc(W * 0.85 - 20, py - 20, 50, 0, Math.PI * 2);
      ctx.fill();
      // 별
      for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${0.25 + s.s * 0.25})`;
        const size = s.s > 2 ? 2 : 1;
        ctx.fillRect(s.x, s.y, size, size * (s.s > 2 ? 3 : 1)); // 빠른 별은 길게
      }
    }

    // 로봇 (가운데 = 맞는 곳)
    function drawRobot(x, y, tilt, scale = 1, flame = true) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);
      ctx.scale(scale, scale);
      // 발의 불꽃
      if (flame) {
        for (const fx of [-8, 8]) {
          const fl = 10 + Math.random() * 7 + (keys.up ? 6 : 0);
          const g = ctx.createLinearGradient(0, 16, 0, 16 + fl);
          g.addColorStop(0, "#fff6c0");
          g.addColorStop(0.4, "#ffb347");
          g.addColorStop(1, "rgba(255,80,40,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(fx - 5, 16);
          ctx.lineTo(fx + 5, 16);
          ctx.lineTo(fx, 16 + fl);
          ctx.fill();
        }
      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#1b2440";
      ctx.fillStyle = "#7d8bb0";
      box(-13, 6, 10, 11, 3);   // 왼발
      box(3, 6, 10, 11, 3);     // 오른발
      ctx.fillStyle = "#5f6f99";
      box(-19, -27, 6, 18, 2);  // 왼쪽 총
      box(13, -27, 6, 18, 2);   // 오른쪽 총
      ctx.fillStyle = "#c8d3ef";
      box(-24, -11, 11, 15, 4); // 왼쪽 어깨
      box(13, -11, 11, 15, 4);  // 오른쪽 어깨
      ctx.fillStyle = "#e8eefc";
      box(-13, -12, 26, 22, 6); // 몸통
      // 가슴의 빛나는 코어
      ctx.fillStyle = "#38e1ff";
      ctx.shadowColor = "#38e1ff";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#e8eefc";
      box(-8, -25, 16, 12, 4);  // 머리
      ctx.fillStyle = "#38e1ff";
      ctx.fillRect(-6, -21, 12, 4); // 눈
      ctx.beginPath();              // 안테나
      ctx.moveTo(0, -25);
      ctx.lineTo(0, -31);
      ctx.stroke();
      ctx.fillStyle = frame % 30 < 15 ? "#ff5d7a" : "#ffd166";
      ctx.beginPath();
      ctx.arc(0, -32, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPlayer() {
      if (!player.visible) return;
      if (invuln > 0 && frame % 8 < 4) return; // 무적일 때는 깜빡깜빡
      drawRobot(player.x, player.y, player.tilt);
      // Shift를 누르면 맞는 곳(작은 점)을 보여 줘요
      if (keys.slow && state === "play") {
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#ff3c5a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r + 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    // 우리 우주선: 고향으로 가는 중. 로봇 뒤에서 위쪽을 보고 날아가요 (화물칸 문은 위쪽)
    function drawCarrier(x, y, hatch, scale = 1) {
      if (y < -140 || y > H + 140) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, -scale); // 위아래 뒤집기: 엔진은 아래, 조종석은 위
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#2a3a66";
      // 엔진 불꽃 (위쪽)
      for (const ex of [-60, 60]) {
        ctx.fillStyle = `rgba(120,200,255,${0.5 + Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.ellipse(ex, -36, 10, 8 + Math.random() * 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // 본체
      ctx.fillStyle = "#9fb3d9";
      ctx.beginPath();
      ctx.moveTo(-115, 0); ctx.lineTo(-75, -30); ctx.lineTo(75, -30);
      ctx.lineTo(115, 0); ctx.lineTo(75, 30); ctx.lineTo(-75, 30);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#5f77b3";
      ctx.fillRect(-95, -5, 190, 10);
      // 조종석
      ctx.fillStyle = "#bfe6ff";
      ctx.beginPath();
      ctx.ellipse(0, -18, 26, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 깜빡이는 불빛
      ctx.fillStyle = frame % 30 < 15 ? "#ffd166" : "#38e1ff";
      for (const lx of [-70, -40, 40, 70]) {
        ctx.beginPath();
        ctx.arc(lx, 18, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      // 아래쪽 문 (열리면 까맣게)
      ctx.fillStyle = "#0b0f24";
      ctx.fillRect(-20 * hatch, 22, 40 * hatch, 10);
      ctx.restore();
    }

    // 지원 사격: 우주선에서 레이저 다섯 줄기 + 미사일, 그리고 아래로 내려가는 빛의 선
    function drawSupport() {
      if (!support) return;
      const s = support;
      if (s.t > 20 && s.t <= 80) {
        ctx.fillStyle = "rgba(120,220,255,0.12)";
        ctx.fillRect(0, s.line, W, H - s.line);
        ctx.shadowColor = "#38e1ff";
        ctx.shadowBlur = 16;
        for (const bx of [-90, -45, 0, 45, 90]) {
          const g = ctx.createLinearGradient(0, s.y, 0, s.line);
          g.addColorStop(0, "rgba(255,255,255,0.95)");
          g.addColorStop(1, "rgba(56,225,255,0.5)");
          ctx.fillStyle = g;
          ctx.fillRect(W / 2 + bx - 4, s.line, 8, s.y - 20 - s.line);
        }
        ctx.fillStyle = "#e6fbff";
        ctx.fillRect(0, s.line - 3, W, 6);
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = "#e6fbff";
      for (const m of s.missiles) {
        ctx.beginPath();
        ctx.ellipse(m.x, m.y, 2.5, 7, -m.vx * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }
      drawCarrier(W / 2, s.y, 0);
    }


    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.lineWidth = 2;
      if (e.type === "meteor") {
        ctx.rotate(e.rot);
        ctx.fillStyle = "#8b7b6b";
        ctx.strokeStyle = "#4a3f35";
        ctx.beginPath();
        e.shape.forEach((k, i) => {
          const a = (i / e.shape.length) * Math.PI * 2;
          ctx.lineTo(Math.cos(a) * e.r * k, Math.sin(a) * e.r * k);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(0,0,0,0.25)"; // 구덩이
        ctx.beginPath();
        ctx.arc(-e.r * 0.3, -e.r * 0.2, e.r * 0.22, 0, Math.PI * 2);
        ctx.arc(e.r * 0.35, e.r * 0.3, e.r * 0.15, 0, Math.PI * 2);
        ctx.fill();
      } else if (e.type === "fighter") {
        // 아래를 보고 있는 빨간 전투기
        ctx.fillStyle = frame % 6 < 3 ? "#ffb347" : "#ff7a3c"; // 엔진 불
        ctx.beginPath();
        ctx.arc(-6, -14, 3, 0, Math.PI * 2);
        ctx.arc(6, -14, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#c23b5a";
        ctx.strokeStyle = "#3a0f1c";
        ctx.beginPath();
        ctx.moveTo(0, 16); ctx.lineTo(-17, -8); ctx.lineTo(-6, -12);
        ctx.lineTo(0, -6); ctx.lineTo(6, -12); ctx.lineTo(17, -8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ff5d7a";
        ctx.beginPath();
        ctx.ellipse(0, 0, 6, 13, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.ellipse(0, 4, 3, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (e.type === "shooter") {
        // 보라색 원반 적함
        ctx.fillStyle = "#7b4fd6";
        ctx.strokeStyle = "#2a1450";
        ctx.beginPath();
        ctx.ellipse(0, 0, 28, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#c9a8ff";
        ctx.beginPath();
        ctx.ellipse(0, -5, 12, 9, 0, Math.PI, 0);
        ctx.fill();
        ctx.stroke();
        for (let k = 0; k < 5; k++) {
          ctx.fillStyle = (Math.floor(frame / 8) + k) % 2 ? "#ffd166" : "#ff8c42";
          ctx.beginPath();
          ctx.arc(-18 + k * 9, 4, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        // 쏘기 직전에는 아래 포구가 빨갛게 빛나요
        const charge = e.mode === "stay" && e.stay % 55 > 15 && e.stay % 55 <= 30;
        ctx.fillStyle = charge ? "#ff3c5a" : "#3a2470";
        ctx.beginPath();
        ctx.arc(0, 12, 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (e.type === "boss") {
        drawBoss(e);
      }
      // 맞으면 잠깐 하얗게 번쩍
      if (e.flash > 0 && e.type !== "boss") {
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBoss(e) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#2a0816";
      // 날개
      ctx.fillStyle = "#5b1e3a";
      ctx.beginPath();
      ctx.moveTo(-115, -10); ctx.lineTo(-65, -42); ctx.lineTo(65, -42);
      ctx.lineTo(115, -10); ctx.lineTo(85, 32); ctx.lineTo(-85, 32);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // 본체
      ctx.fillStyle = e.flash > 0 ? "#c45a84" : "#8a2b52";
      ctx.beginPath();
      ctx.ellipse(0, 0, 70, 40, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.moveTo(-50, -20); ctx.lineTo(50, -20);
      ctx.moveTo(-60, 20); ctx.lineTo(60, 20);
      ctx.stroke();
      // 양쪽 포탑
      for (const side of [-70, 70]) {
        ctx.fillStyle = "#3a0f24";
        ctx.beginPath();
        ctx.arc(side, 20, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ff5d7a";
        ctx.beginPath();
        ctx.arc(side, 22, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      // 가운데 코어 (두근두근)
      const pulse = 12 + Math.sin(frame * 0.15) * 3;
      const g = ctx.createRadialGradient(0, 8, 2, 0, 8, pulse * 1.8);
      g.addColorStop(0, "#fff3c0");
      g.addColorStop(0.4, "#ff9f1c");
      g.addColorStop(1, "rgba(255,60,60,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 8, pulse * 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBullets() {
      // 로봇 총알 (파란 빛줄기)
      ctx.fillStyle = "#8ff0ff";
      ctx.shadowColor = "#38e1ff";
      ctx.shadowBlur = 8;
      for (const b of bullets) ctx.fillRect(b.x - 1.5, b.y - 8, 3, 14);
      ctx.shadowBlur = 0;
      // 적 총알 (색깔 동그라미 + 하얀 가운데)
      for (const b of eBullets) {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = p.life / p.max;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }

    // 게임 화면 위에 띄우는 것들 (보스 체력, 경고, 가운데 큰 글자)
    function drawFieldText() {
      const boss = enemies.find((e) => e.type === "boss");
      if (boss) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(40, 14, W - 80, 10);
        ctx.fillStyle = "#ff5d7a";
        ctx.fillRect(40, 14, (W - 80) * Math.max(0, boss.hp / boss.maxHp), 10);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.strokeRect(40, 14, W - 80, 10);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (warning > 0 && Math.floor(warning / 15) % 2 === 0) {
        ctx.fillStyle = "rgba(255,40,70,0.25)";
        ctx.fillRect(0, H / 2 - 50, W, 100);
        ctx.fillStyle = "#ff5d7a";
        ctx.font = "bold 38px Arial, sans-serif";
        ctx.fillText("⚠ WARNING ⚠", W / 2, H / 2 - 12);
        ctx.font = "bold 18px 'Malgun Gothic', sans-serif";
        ctx.fillText("우주 해적 모함 접근 중!", W / 2, H / 2 + 24);
      }
      if (banner) {
        ctx.globalAlpha = Math.min(1, banner.t / 30);
        ctx.fillStyle = "#38e1ff";
        ctx.font = "bold 22px 'Malgun Gothic', sans-serif";
        ctx.fillText(banner.top, W / 2, H / 2 - 40);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 46px 'Malgun Gothic', sans-serif";
        ctx.fillText(banner.big, W / 2, H / 2 + 10);
        ctx.globalAlpha = 1;
      }
      ctx.textBaseline = "alphabetic";
    }

    // ----- 오른쪽 점수판 -----
    function drawPanel() {
      const x = PANEL_X;
      const cx = x + PANEL_W / 2;
      ctx.fillStyle = "#0d1130";
      ctx.fillRect(x, 0, PANEL_W, H);
      ctx.fillStyle = "#2b3467";
      ctx.fillRect(x, 0, 4, H);

      const label = (text, y) => {
        ctx.fillStyle = "#8a93c0";
        ctx.font = "bold 13px 'Malgun Gothic', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(text, x + 20, y);
      };
      const line = (y) => {
        ctx.fillStyle = "#1f2752";
        ctx.fillRect(x + 16, y, PANEL_W - 32, 2);
      };

      // 점수
      label("점수", 34);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 30px Arial, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(score.toLocaleString(), x + PANEL_W - 20, 70);
      ctx.fillStyle = "#8a93c0";
      ctx.font = "13px 'Malgun Gothic', sans-serif";
      ctx.fillText("최고 " + Math.max(best, score).toLocaleString(), x + PANEL_W - 20, 94);
      line(110);

      // 목숨: 남은 만큼 로봇이 밝게
      label("목숨", 138);
      for (let i = 0; i < LIVES; i++) {
        ctx.globalAlpha = i < lives ? 1 : 0.2;
        drawRobot(x + 50 + i * 50, 172, 0, 0.75, false);
      }
      ctx.globalAlpha = 1;
      line(204);

      // 지원 사격
      label("지원 사격 (Space)", 232);
      ctx.globalAlpha = bombs > 0 ? 1 : 0.25;
      drawCarrier(cx, 268, 0, 0.6);
      ctx.globalAlpha = 1;
      ctx.textAlign = "center";
      ctx.font = "bold 15px 'Malgun Gothic', sans-serif";
      ctx.fillStyle = bombs > 0 ? "#38e1ff" : "#556";
      ctx.fillText(bombs > 0 ? "준비 완료!" : "사용함", cx, 312);
      ctx.fillStyle = "#6b7399";
      ctx.font = "12px 'Malgun Gothic', sans-serif";
      ctx.fillText("죽으면 다시 채워져요", cx, 331);
      line(348);

      // 스테이지 목록 (2~5는 제작 예정)
      label("스테이지", 376);
      STAGES.forEach((st, i) => {
        const y = 392 + i * 34;
        const now = i === stageIndex && state !== "title";
        ctx.fillStyle = now ? "#1f3a6e" : "#141a3d";
        ctx.strokeStyle = now ? "#38e1ff" : "#232b5a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(x + 16, y, PANEL_W - 32, 28, 6);
        ctx.fill();
        ctx.stroke();
        ctx.textAlign = "left";
        ctx.font = "bold 13px 'Malgun Gothic', sans-serif";
        ctx.fillStyle = st.ready ? "#fff" : "#5a6290";
        ctx.fillText(`${i + 1}. ${st.name}`, x + 26, y + 19);
        ctx.textAlign = "right";
        ctx.font = "11px 'Malgun Gothic', sans-serif";
        ctx.fillStyle = st.ready ? "#38e1ff" : "#5a6290";
        ctx.fillText(st.ready ? (now ? "◀ 지금" : "") : "🔒 제작 예정", x + PANEL_W - 24, y + 18);
      });

      // 조작 방법
      ctx.textAlign = "center";
      ctx.fillStyle = "#6b7399";
      ctx.font = "12px 'Malgun Gothic', sans-serif";
      ctx.fillText("방향키 이동 · Shift 천천히", cx, H - 16);
    }

    function draw() {
      // 왼쪽 게임 화면 (흔들릴 때도 점수판은 그대로)
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.clip();
      if (shake > 0) ctx.translate(rand(-1, 1) * shake * 0.4, rand(-1, 1) * shake * 0.4);
      drawBackground();
      drawCarrier(carrier.x, carrier.y, carrier.hatch);
      for (const e of enemies) if (e.wait <= 0) drawEnemy(e);
      drawPlayer();
      drawBullets();
      drawSupport();
      drawParticles();
      if (state !== "title") drawFieldText();
      ctx.restore();
      drawPanel();
    }

    // ===== 계속 반복하기 =====
    // 모니터가 빠르든 느리든 1초에 60번만 움직이도록 맞춤
    const STEP = 1000 / 60;
    let lastTime = performance.now();
    let acc = 0;
    function loop(now) {
      acc += Math.min(now - lastTime, 100);
      lastTime = now;
      while (acc >= STEP) {
        update();
        acc -= STEP;
      }
      draw();
      requestAnimationFrame(loop);
    }

    // ===== 시작 / 끝 =====
    function startGame() {
      stageIndex = 0;
      stageT = 0;
      score = 0;
      lives = LIVES;
      bombs = 1;
      support = null;
      invuln = 0;
      warning = 0;
      bullets = [];
      enemies = [];
      eBullets = [];
      particles = [];
      timeline = buildTimeline();
      player.tilt = 0;
      banner = { top: "STAGE 1", big: STAGES[0].name, t: 240 };
      overlay.classList.add("hidden");
      startDrop();
    }

    function showEnd(title, color, text) {
      state = "end";
      endShownAt = performance.now();
      if (score > best) {
        best = score;
        try { localStorage.setItem("robotBest", best); } catch (e) {}
      }
      message.textContent = title;
      message.style.color = color;
      sub.innerHTML = text + `<br>점수 ${score.toLocaleString()} · 최고 ${best.toLocaleString()}`;
      startBtn.textContent = "다시 출격";
      overlay.classList.remove("hidden");
    }

    function showLose() {
      showEnd("패배…", "#ff5d7a", "로봇을 모두 잃고 우주선이 해적에게 붙잡혔어요.<br>Shift로 천천히 움직이면 피하기 쉬워요!");
    }

    function showClear() {
      showEnd("스테이지 1 클리어!", "#ffd166",
        "해적 모함을 물리치고 우주선을 지켜 냈어요! 🎉<br>고향까지는 아직 먼 길…<br><span style='color:#aab'>스테이지 2~5는 제작 예정이에요.</span>");
    }

    startBtn.addEventListener("click", () => {
      startBtn.blur(); // 스페이스가 버튼을 또 누르지 않게
      startGame();
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
